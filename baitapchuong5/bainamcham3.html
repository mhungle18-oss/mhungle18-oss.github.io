<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 5.3 & Bài 5.4 - Tooltips</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Font Awesome Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main class="container my-5">
            <!-- Tooltips on Links -->
            <section class="mb-5">
                <h3>Tooltips on Links</h3>
                <p>
                    <a href="#" data-bs-toggle="tooltip" data-bs-title="Tooltip">Tooltip</a>
                    <a href="#" data-bs-toggle="tooltip" data-bs-title="Another tooltip" class="ms-3">Another tooltip</a>
                    <a href="#" data-bs-toggle="tooltip" data-bs-title="Large tooltip" class="ms-3">Large tooltip</a>
                    <a href="#" data-bs-toggle="tooltip" data-bs-title="Last tooltip" class="ms-3">Last tooltip</a>
                </p>
            </section>

            <!-- Tooltips on Buttons -->
            <section class="mb-5">
                <h3>Tooltips on Buttons</h3>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-title="Tooltip">Tooltip</button>
                    <button type="button" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-title="Another tooltip">Another tooltip</button>
                    <button type="button" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-title="Large tooltip">Large tooltip</button>
                    <button type="button" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-title="Last tooltip">Last tooltip</button>
                </div>
            </section>

            <!-- Tooltips on Icons -->
            <section class="mb-5">
                <h3>Tooltips on Icons</h3>
                <div class="d-flex gap-3 fs-4">
                    <i class="fa-solid fa-pen-nib" data-bs-toggle="tooltip" data-bs-title="Edit" style="cursor: pointer;"></i>
                    <i class="fa-solid fa-download" data-bs-toggle="tooltip" data-bs-title="Download" style="cursor: pointer;"></i>
                    <i class="fa-solid fa-print" data-bs-toggle="tooltip" data-bs-title="Print" style="cursor: pointer;"></i>
                    <i class="fa-solid fa-trash" data-bs-toggle="tooltip" data-bs-title="Delete" style="cursor: pointer;"></i>
                    <i class="fa-solid fa-gear" data-bs-toggle="tooltip" data-bs-title="Settings" style="cursor: pointer;"></i>
                </div>
            </section>

            <!-- Bài 5.4: Tooltips theo vị trí (Top, Right, Bottom, Left) -->
            <section class="mb-5">
                <h3>Bài 5.4: Tooltips Positions</h3>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-primary" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Tooltip on top">Tooltip on top</button>
                    <button type="button" class="btn btn-primary" data-bs-toggle="tooltip" data-bs-placement="right" data-bs-title="Tooltip on right">Tooltip on right</button>
                    <button type="button" class="btn btn-primary" data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Tooltip on bottom">Tooltip on bottom</button>
                    <button type="button" class="btn btn-primary" data-bs-toggle="tooltip" data-bs-placement="left" data-bs-title="Tooltip on left">Tooltip on left</button>
                </div>
            </section>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script>
            // Kích hoạt tất cả tooltips trong trang
            const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
            const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
        </script>
    </body>
</html>
