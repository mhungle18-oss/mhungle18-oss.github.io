<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 5.6 - Hồ sơ cá nhân Collapse</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main class="container my-5" style="max-width: 700px;">
            <h2 class="mb-4">Hồ sơ cá nhân</h2>

            <!-- Điều khiển hiển thị / ẩn tất cả -->
            <div class="mb-4">
                <button class="btn btn-dark me-2" type="button" id="btnShowAll">Hiển thị tất cả</button>
                <button class="btn btn-secondary" type="button" id="btnHideAll">Ẩn tất cả</button>
            </div>

            <!-- Danh sách các mục Collapse -->
            <div class="accordion border-0" id="profileAccordion">
                <!-- Họ tên -->
                <div class="border-bottom mb-2">
                    <button class="btn btn-light w-100 text-start py-2 px-3 fw-medium" type="button" data-bs-toggle="collapse" data-bs-target="#collapseName" aria-expanded="false" aria-controls="collapseName">
                        Họ tên
                    </button>
                    <div class="collapse profile-item" id="collapseName">
                        <div class="p-3 bg-light rounded-bottom">
                            <strong>Nguyễn Văn A</strong>
                        </div>
                    </div>
                </div>

                <!-- Email -->
                <div class="border-bottom mb-2">
                    <button class="btn btn-light w-100 text-start py-2 px-3 fw-medium" type="button" data-bs-toggle="collapse" data-bs-target="#collapseEmail" aria-expanded="false" aria-controls="collapseEmail">
                        Email
                    </button>
                    <div class="collapse profile-item" id="collapseEmail">
                        <div class="p-3 bg-light rounded-bottom">
                            nguyenvana@gmail.com
                        </div>
                    </div>
                </div>

                <!-- Kỹ năng -->
                <div class="border-bottom mb-2">
                    <button class="btn btn-light w-100 text-start py-2 px-3 fw-medium" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSkills" aria-expanded="false" aria-controls="collapseSkills">
                        Kỹ năng
                    </button>
                    <div class="collapse profile-item" id="collapseSkills">
                        <div class="p-3 bg-light rounded-bottom">
                            HTML5, CSS3, JavaScript, Bootstrap 5, Git, ReactJS basic.
                        </div>
                    </div>
                </div>

                <!-- Kinh nghiệm làm việc -->
                <div class="border-bottom mb-2">
                    <button class="btn btn-light w-100 text-start py-2 px-3 fw-medium" type="button" data-bs-toggle="collapse" data-bs-target="#collapseExperience" aria-expanded="false" aria-controls="collapseExperience">
                        Kinh nghiệm làm việc
                    </button>
                    <div class="collapse profile-item" id="collapseExperience">
                        <div class="p-3 bg-light rounded-bottom">
                            - 1 năm thực tập Front-end Developer tại Công ty ABC.<br>
                            - Tham gia phát triển 3 dự án Web Responsive cho khách hàng.
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script>
            const collapseElements = document.querySelectorAll('.profile-item');
            const collapseList = [...collapseElements].map(el => new bootstrap.Collapse(el, { toggle: false }));

            document.getElementById('btnShowAll').addEventListener('click', () => {
                collapseList.forEach(c => c.show());
            });

            document.getElementById('btnHideAll').addEventListener('click', () => {
                collapseList.forEach(c => c.hide());
            });
        </script>
    </body>
</html>
