<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 5.5 - Thanh tiến trình (Progress Bar)</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main class="container my-5">
            <h2 class="mb-4">Bài 5.5: Tạo thanh tiến trình theo mẫu</h2>

            <!-- a) Thanh tiến trình cơ bản -->
            <section class="mb-5">
                <h4>a) Thanh tiến trình có nhãn phần trăm</h4>
                <div class="progress" role="progressbar" aria-valuenow="33" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar" style="width: 33%">33%</div>
                </div>
            </section>

            <!-- b) Thanh tiến trình dạng kẻ sọc -->
            <section class="mb-5">
                <h4>b) Thanh tiến trình dạng kẻ sọc (progress-bar-striped)</h4>
                <div class="progress mb-3" role="progressbar" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped" style="width: 10%"></div>
                </div>
                <div class="progress mb-3" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped bg-success" style="width: 25%"></div>
                </div>
                <div class="progress mb-3" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped bg-info" style="width: 50%"></div>
                </div>
                <div class="progress mb-3" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped bg-warning" style="width: 75%"></div>
                </div>
                <div class="progress mb-3" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped bg-danger" style="width: 100%"></div>
                </div>
            </section>

            <!-- c) Thanh tiến trình có văn bản thông báo -->
            <section class="mb-5">
                <h4>c) Thanh tiến trình hiển thị nội dung thông báo</h4>
                <div class="progress mb-3" style="height: 25px;" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped bg-success" style="width: 25%">Disk space: 25% free</div>
                </div>
                <div class="progress mb-3" style="height: 25px;" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped bg-warning" style="width: 60%">Enough Disk Space: 60% free</div>
                </div>
                <div class="progress mb-3" style="height: 25px;" role="progressbar" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped bg-danger" style="width: 90%">Not Enough Disk Space: 90% full</div>
                </div>
            </section>

            <!-- d) Thanh tiến trình màu sắc -->
            <section class="mb-5">
                <h4>d) Thanh tiến trình màu sắc</h4>
                <div class="progress mb-3" role="progressbar" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-success" style="width: 20%"></div>
                </div>
                <div class="progress mb-3" role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-info" style="width: 40%"></div>
                </div>
                <div class="progress mb-3" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-warning" style="width: 60%"></div>
                </div>
                <div class="progress mb-3" role="progressbar" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-danger" style="width: 80%"></div>
                </div>
                <div class="progress mb-3" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-dark" style="width: 100%"></div>
                </div>
            </section>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
